name: QA release CONTREM
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/academia/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/qa-release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout sem credenciais persistentes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Versões das ferramentas
        run: node --version && npm --version
      - name: Sintaxe e configuração
        run: npm run check
      - name: Verificações dos módulos
        run: npm test
      - name: Build com exigências de produção
        run: npm run build
        env:
          VERCEL_ENV: production
      - name: Testes da distribuição central
        run: npm run test:central
      - name: Testes de regressão da release
        run: node --test tests/release.test.mjs
      - name: Verificar espaços e conflito
        run: git diff --check
