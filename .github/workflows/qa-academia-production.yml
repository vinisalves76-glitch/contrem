name: QA produção — Academia Developer conectada
on:
  pull_request:
    branches: [main]
    paths:
      - "apps/academia/**"
      - "scripts/build-central.mjs"
      - ".github/workflows/qa-academia-production.yml"
  push:
    branches: [release/academia-developer-prod-20261122]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Instalar dependências de QA da Academia
        run: npm ci --prefix apps/academia
      - name: Verificar sintaxe e configuração
        run: npm run check
      - name: Simular build de produção
        run: npm run build
        env:
          VERCEL_ENV: production
      - name: Testar contratos da Academia
        run: npm test
      - name: Proteger distribuição central e outros módulos
        run: npm run test:central
      - run: git diff --check
